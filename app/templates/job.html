<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export {{ job.id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <main class="page-shell job-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Export job</p>
          <h1>{{ job.id }}</h1>
        </div>
        <div class="status-strip">
          <span id="status-pill" class="status-pill">{{ job.status }}</span>
          <a class="text-link" href="/">New export</a>
        </div>
      </header>

      <section class="form-band">
        <div class="section-heading">
          <p class="eyebrow">Progress</p>
          <h2 id="job-title">Preparing export</h2>
        </div>
        <div id="summary" class="summary-grid"></div>
        <pre id="log" class="log-window" aria-live="polite"></pre>
        <div class="action-bar">
          <a id="download" class="button secondary hidden" href="/exports/{{ job.id }}/download">Download ZIP</a>
          <form id="resume-form" class="hidden" method="post" action="/jobs/{{ job.id }}/resume">
            <button type="submit" class="button">Resume from last phase</button>
          </form>
        </div>
      </section>
    </main>

    <script>
      const jobId = "{{ job.id }}";
      const logElement = document.querySelector("#log");
      const statusPill = document.querySelector("#status-pill");
      const jobTitle = document.querySelector("#job-title");
      const summaryElement = document.querySelector("#summary");
      const downloadLink = document.querySelector("#download");
      const resumeForm = document.querySelector("#resume-form");

      function renderSummary(metadata) {
        if (!metadata || !metadata.counts) {
          summaryElement.innerHTML = "";
          return;
        }
        const counts = metadata.counts;
        const items = [
          ["Clients", counts.clients],
          ["Appointments", counts.appointments],
          ["Intakes", counts.fullIntakes],
          ["Patients", counts.patients],
        ];
        summaryElement.innerHTML = items.map(([label, value]) => `
          <div class="metric">
            <span>${label}</span>
            <strong>${value ?? 0}</strong>
          </div>
        `).join("");
      }

      async function refreshJob() {
        const response = await fetch(`/api/jobs/${jobId}`, { cache: "no-store" });
        if (!response.ok) return;
        const job = await response.json();
        statusPill.textContent = job.status;
        statusPill.className = `status-pill ${job.status}`;
        logElement.textContent = (job.messages || []).join("\n");
        logElement.scrollTop = logElement.scrollHeight;
        renderSummary(job.metadata);

        if (job.status === "completed") {
          jobTitle.textContent = "Export complete";
          downloadLink.classList.remove("hidden");
          resumeForm.classList.add("hidden");
          return;
        }
        if (job.status === "failed") {
          jobTitle.textContent = job.error || "Export failed";
          if (job.canResume) {
            resumeForm.classList.remove("hidden");
          }
          return;
        }
        resumeForm.classList.add("hidden");
        jobTitle.textContent = job.status === "running" ? "Export running" : "Export queued";
        setTimeout(refreshJob, 2500);
      }

      refreshJob();
    </script>
  </body>
</html>
